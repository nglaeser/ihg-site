<!-- Portfolio Modals -->
{% for post in site.posts %}
<div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog"
    aria-hidden="true">
    <div class="modal-content">
        <div class="close-modal" data-dismiss="modal">
            <div class="lr">
                <div class="rl">
                </div>
            </div>
        </div>
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-8 col-lg-offset-2">
                    <div class="modal-body">
                        <h2>{{ post.title }}</h2>
                        <hr class="star-primary">
                        <figure>
                            <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered"
                                alt="{{ post.alt }}">
                            {% if post.img-copyright %}
                                {{ post.img-copyright }}
                            {% endif %}
                        </figure>
                        <ul class="list-inline item-details">
                            <li><strong>Duration:</strong>
                                {{ post.duration }}
                            </li>
                            <li><strong>Date:</strong>
                                {{ post.trip-date }}
                            </li>
                            <li><strong>Group size:</strong>
                                {{ post.group-size }}
                            </li>
                        </ul>
                        <div class="text-left">
                        <p>{{ post.description }}</p>
                        </div>
                        <div class="content text-left">
                            {{ post.content }}
                        </div>
                        <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i>
                            Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endfor %}
